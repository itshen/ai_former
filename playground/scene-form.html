<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册表单场景</title>
    <link rel="stylesheet" href="v2-sidebar-redesign.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow-y: auto;
        }
        body {
            background: var(--bg-secondary);
            padding: 40px;
        }
    </style>
</head>
<body>
    <div style="max-width: 800px; margin: 0 auto;">
        <h1 class="mock-page-title">用户注册表单</h1>
        <p class="mock-page-subtitle">
            这是一个模拟的表单页面，用于展示侧边栏与表单的交互效果。点击表单字段可以看到 AI Former 的智能填充功能。
        </p>
        
        <div class="mock-form">
            <!-- 0. 头像上传 -->
            <div class="mock-form-group">
                <label class="mock-label">头像</label>
                <div class="mock-avatar-upload">
                    <div class="mock-avatar-placeholder" onclick="alert('点击上传头像')">
                        <i data-lucide="user"></i>
                        <span class="mock-avatar-hint">点击上传</span>
                    </div>
                </div>
            </div>
            
            <!-- 1-2. 姓名 + 性别（两列） -->
            <div class="mock-form-row">
                <!-- 1. 姓名（有缓存） -->
                <div class="mock-form-group">
                    <label class="mock-label">姓名 *</label>
                    <input type="text" class="mock-input" placeholder="请输入真实姓名" data-cache="张明">
                </div>
                
                <!-- 2. 性别 -->
                <div class="mock-form-group">
                    <label class="mock-label">性别</label>
                    <select class="mock-select">
                        <option value="">请选择</option>
                        <option value="male">男</option>
                        <option value="female">女</option>
                        <option value="other">其他</option>
                    </select>
                </div>
            </div>
            
            <!-- 3-4. 学历 + 年龄（两列） -->
            <div class="mock-form-row">
                <!-- 3. 学历 -->
                <div class="mock-form-group">
                    <label class="mock-label">学历</label>
                    <select class="mock-select">
                        <option value="">请选择</option>
                        <option value="high_school">高中</option>
                        <option value="bachelor">本科</option>
                        <option value="master">硕士</option>
                        <option value="doctor">博士</option>
                    </select>
                </div>
                
                <!-- 4. 年龄 -->
                <div class="mock-form-group">
                    <label class="mock-label">年龄</label>
                    <input type="number" class="mock-input" placeholder="请输入年龄" min="1" max="120">
                </div>
            </div>
            
            <!-- 5-6. 邮箱 + 手机号（两列） -->
            <div class="mock-form-row">
                <!-- 5. 邮箱（有缓存） -->
                <div class="mock-form-group">
                    <label class="mock-label">邮箱 *</label>
                    <input type="email" class="mock-input" placeholder="example@domain.com" data-cache="zhangming@example.com">
                </div>
                
                <!-- 6. 手机号 -->
                <div class="mock-form-group">
                    <label class="mock-label">手机号 *</label>
                    <input type="tel" class="mock-input" placeholder="请输入手机号">
                </div>
            </div>
            
            <!-- 7. 地址（完整一行） -->
            <div class="mock-form-group">
                <label class="mock-label">地址</label>
                <input type="text" class="mock-input" placeholder="请输入详细地址">
            </div>
            
            <!-- 8. 自我介绍（多行） -->
            <div class="mock-form-group">
                <label class="mock-label">自我介绍</label>
                <textarea class="mock-textarea" rows="4" placeholder="简单介绍一下自己..."></textarea>
            </div>
            
            <!-- 9. 密码（不可翻译） -->
            <div class="mock-form-group">
                <label class="mock-label">密码 *</label>
                <input type="password" class="mock-input" placeholder="请输入密码">
            </div>
            
            <!-- 10. 确认密码（不可翻译） -->
            <div class="mock-form-group">
                <label class="mock-label">确认密码 *</label>
                <input type="password" class="mock-input" placeholder="请再次输入密码">
            </div>
            
            <!-- 11. 进度条示例（只读） -->
            <div class="mock-form-group">
                <label class="mock-label">个人资料完整度</label>
                <div class="mock-progress-bar">
                    <div class="mock-progress-fill" style="width: 60%;"></div>
                </div>
            </div>
            
            <!-- 12. 禁用字段示例 -->
            <div class="mock-form-group">
                <label class="mock-label">用户ID（系统生成）</label>
                <input type="text" class="mock-input mock-input-disabled" value="USR_20240315_001" readonly>
            </div>
            
            <button class="mock-submit">提交注册</button>
        </div>
    </div>

    <script src="lucide.min.js"></script>
    <script src="v2-sidebar-redesign.js"></script>
</body>
</html>
